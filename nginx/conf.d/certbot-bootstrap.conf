# Temporary HTTP-only config used during initial certbot certificate issuance.
# After certbot succeeds, this file is removed and marketlens.conf takes over.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
