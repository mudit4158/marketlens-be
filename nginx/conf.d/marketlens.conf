# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name marketlenss.duckdns.org;

    # Required for certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name marketlenss.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/marketlenss.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketlenss.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Proxy to FastAPI app container
    # Use Docker embedded DNS so nginx doesn't fail to start if api isn't up yet
    resolver 127.0.0.11 valid=30s;
    set $upstream http://api:8001;
    location / {
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
